name: Live Market Data

# Refreshes Nifty / Sensex / Brent / USD-INR / India VIX / FII-DII
# every 15 minutes during Indian market hours (Mon-Fri).
on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch live market data
        run: |
          python3 - <<'PY'
          # Fetches live Indian market data (Yahoo Finance + NSE) and writes market-live.json
          import urllib.request, urllib.parse, json, datetime

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"


          def yahoo(sym):
              url = ("https://query1.finance.yahoo.com/v8/finance/chart/"
                     + urllib.parse.quote(sym) + "?interval=1d&range=5d")
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              d = json.load(urllib.request.urlopen(req, timeout=30))
              m = d["chart"]["result"][0]["meta"]
              price = m.get("regularMarketPrice")
              pct = m.get("regularMarketChangePercent")
              chg = None
              if price is not None and pct is not None:
                  base = price / (1.0 + pct / 100.0) if pct != -100 else price
                  chg = round(price - base, 2)
              return {
                  "price": round(price, 2) if price is not None else None,
                  "change": chg,
                  "pct": round(pct, 2) if pct is not None else None,
              }


          def nse_fiidii():
              url = "https://www.nseindia.com/api/fiidiiTradeReact"
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA, "Accept": "*/*",
                  "Accept-Language": "en-US,en;q=0.9"})
              data = json.load(urllib.request.urlopen(req, timeout=30))
              out = {}
              for row in data:
                  c = (row.get("category") or "").upper()
                  try:
                      net = round(float(row.get("netValue")), 2)
                  except (TypeError, ValueError):
                      continue
                  if c.startswith("FII"):
                      out["fii"] = {"date": row.get("date"), "net": net}
                  elif c.startswith("DII"):
                      out["dii"] = {"date": row.get("date"), "net": net}
              return out


          def main():
              out = {"updated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")}
              sources = [
                  ("nifty", "^NSEI"),
                  ("sensex", "^BSESN"),
                  ("brent", "BZ=F"),
                  ("usdinr", "INR=X"),
                  ("vix", "^INDIAVIX"),
              ]
              ok = 0
              for key, sym in sources:
                  try:
                      out[key] = yahoo(sym)
                      ok += 1
                  except Exception as e:
                      out[key] = {"price": None, "change": None, "pct": None}
                      print("warn: %s failed: %s" % (key, e))
              try:
                  out.update(nse_fiidii())
              except Exception as e:
                  print("warn: FII/DII failed: %s" % e)

              if ok == 0:
                  raise SystemExit("All Yahoo quotes failed - not writing file")

              with open("market-live.json", "w", encoding="utf-8") as f:
                  json.dump(out, f, ensure_ascii=True, indent=2)
              print(json.dumps(out, ensure_ascii=True, indent=2))

          main()
          PY

      - name: Commit if changed
        run: |
          git config user.name "vipananam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-live.json
          if git diff --staged --quiet; then
            echo "No change to market-live.json"
          else
            git commit -m "Auto: live market data"
            git push
          fi
